; ESP32-D1 mini (WEMOS/LOLIN D1 mini ESP32, ESP32-WROOM-32, 4MB) + 1.28" round GC9A01 (240x240)
; Ported from the ESP32-C3 Super Mini version.

[env:d1_mini32]
platform = espressif32@6.5.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; The D1 mini ESP32 uses a USB-UART bridge, so no native-USB (CDC) flags are needed.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
